site_name: UnifAI Docs
site_url: https://docs.unifai.network/
site_description: >-
  UnifAI — infrastructure of autonomous AI agents that simplifies DeFi for
  users and developers alike.
docs_dir: docs

theme:
  name: material
  logo: gitbook/assets/logo-single.png
  favicon: gitbook/assets/logo-single.png
  font:
    text: Inter
    code: IBM Plex Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - content.tabs.link
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - js/theme-toggle.js
  - https://platform.twitter.com/widgets.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
      title: On this page

plugins:
  - search

hooks:
  - hooks/gitbook_shim.py

# NAV-START — auto-generated from SUMMARY.md by convert_gitbook.py; do not edit by hand.
nav:
  - Getting Started:
      - index.md
      - getting-started/transaction-fee-and-reward-system.md
      - Guide - Tutorials:
          - getting-started/guide-tutorials/README.md
          - getting-started/guide-tutorials/publish-your-docs.md
          - getting-started/guide-tutorials/how-to-copy-a-strategy.md
      - ❓ FAQ:
          - getting-started/faq/README.md
          - getting-started/faq/faq-defi-users.md
          - getting-started/faq/faq-polymarket-strategies.md
  - FOR DEVELOPERS:
      - for-developers/getting-started.md
      - for-developers/editor.md
      - for-developers/understanding-tool-types.md
      - for-developers/markdown.md
      - for-developers/creating-toolkits.md
      - for-developers/agent-documentation.md
      - for-developers/faq-developers.md
  - Resources:
      - resources/social-and-community-links.md
      - resources/branding-guidelines.md
      - resources/our-community-voices.md
  - Tokenomics:
      - tokenomics/distribution-and-vesting.md
      - tokenomics/token-utility.md
# NAV-END
